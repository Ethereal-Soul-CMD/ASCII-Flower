<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ASCII-Flower</title>
<meta name="description" content="A generative ASCII-Flower">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; color: #8b8b8b; }
  canvas { display: block; touch-action: none; cursor: pointer; }
  .hud { position: fixed; pointer-events: none; font-size: 12px; letter-spacing: .04em; transition: opacity .4s; }
  #name { left: 18px; bottom: calc(18px + env(safe-area-inset-bottom)); color: #8b8b8b; }
  body.nohud .hud { opacity: 0; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud" id="name"></div>
<script src="bloom.js"></script>
</body>
</html>
